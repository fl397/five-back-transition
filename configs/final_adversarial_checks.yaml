# FIVE BACK — pre-specified robustness checks. Every rule below was fixed before the corresponding check number existed; no rule changed after the outcomes were read.
inherits: "configs/analysis_definitions.yaml unchanged — same N_BACK, FIVE_BACK, +4.0 s corrected axis, first-FGA population, RIM_ATTEMPT <= 4 ft, covariates, estimator"
regeneration_check:
  reason: "withheld per-game parquet caches were regenerated by the unchanged builder before the checks; only data/games/*_meta.json had been retained"
  procedure: "move the committed meta files aside, re-run the UNCHANGED src/build_fiveback.py (--workers 16); regenerated *_meta.json must be byte-identical to the committed ones; run the UNCHANGED src/validate_nback.py and src/analyze_fiveback.py in a scratch copy of the project"
  pass_if: "every number in results/fiveback_results.json and results/nback_validation.json reproduces to <= 1e-6 (pp / s); committed results files are not overwritten"
  fail_action: "FIVE_BACK_FINAL_HOLD; no check is run"
check1_common_support:
  time_variable: "time_into_possession (PBP axis, as specified for the primary model; 1-s PBP resolution makes it near-integer)"
  bins_s: {"4-5": "4 <= t < 5", "5-6": "5 <= t < 6", "6-7": "6 <= t < 7", "7-8": "7 <= t < 8", "8-10": "8 <= t <= 10"}
  sample: "corrected-axis first-FGA shots with a pre-shot frame (the primary analysis sample, n = 32,153)"
  per_bin: [N, N_five_back_0, N_five_back_1, frac_five_back_1, rim_rate_0, rim_rate_1, raw_diff_pp, game_clustered_95CI_of_diff, min_N0_N1, "overlap_frac = 2*min(N0,N1)/(N0+N1)"]
  raw_diff_ci: "OLS of RIM on FIVE_BACK within the bin, SE cluster-robust by game"
  stratified_model: "RIM_ATTEMPT ~ FIVE_BACK + time-bin FE (5 bins) + start_type + period dummies (OT pooled with 4) + margin + |margin|; restricted to the union of the five bins; OLS, game-clustered SE, two-sided 95 % CI"
  no_bin_merging: true
  support_classification:
    GOOD_COMMON_SUPPORT: "at least two of the central bins (5-6, 6-7, 7-8) contain meaningful representation of both states — judged from the reported counts and overlap fractions; no numeric threshold is fixed post hoc"
    LIMITED_COMMON_SUPPORT: "FIVE_BACK is nearly deterministic from time in most bins (overlap fractions small in all but one bin)"
  role: "validation only; the primary RCS model is not replaced"
check2_frontcourt_entry:
  definition: "BALL_FRONTCOURT_ENTRY_TIME = time from the possession start on the corrected tracking axis (t_start = c0 + 4.0) to the FIRST tracking frame at which the ball (player_id == -1) is on the offensive side of midcourt: x > 47.0 if the offense attacks R, x < 47.0 if L (direction table from data/games/*_meta.json); ball coordinates only; no shooter, defender or outcome information"
  search_window: "frames with tracking clock in [c_shot + 4.0, t_start] (start to shot instant)"
  already_in_frontcourt: "if the first available ball frame at/after t_start is already on the offensive side, entry_time = 0 and flag ALREADY_IN_FRONTCOURT (reported; kept in the sample with entry_time 0)"
  no_entry: "ball never on the offensive side before the shot instant, or no ball frames -> NO_ENTRY_BEFORE_SHOT / NO_BALL_FRAMES; excluded from FC models and counted"
  back_and_forth: "number of midcourt crossings after the first entry (ball returning to the backcourt then re-entering) within the window; reported as frequency of >= 1 return"
  time_since_entry_at_shot: "TSFE = entry_clock - (c_shot + 4.0) on the tracking axis (seconds; >= 0)"
  flexible_form: "restricted cubic spline of TSFE with knots at the empirical p10/p50/p90 of TSFE in the FC sample (same knot rule as time_into_possession; fixed at dataset build) plus a linear term"
  models:
    FC1: "RIM_ATTEMPT ~ rcs(TSFE) + start_type + period + margin + |margin|"
    FC2: "FC1 + FIVE_BACK"
  report: [FIVE_BACK_coef_CI_in_FC2, R2_FC1, R2_FC2, "CV_logloss FC1 vs FC2 (5-fold game-grouped logistic, seed 20260920)", "corr(time_into_possession, entry_time)", "corr(entry_time, FIVE_BACK) point-biserial", "FIVE_BACK share by TSFE band"]
  interpretation_limit: "'FIVE_BACK contains information beyond offensive advance timing' if the FC2 coefficient remains negative with CI excluding 0 and FC2 fit is not worse than FC1; no causal wording"
check3_first_fga_selection:
  universe: "all primary eligible starts counted by the primary builder (excl['n_starts'] summed over games; expected 48,083)"
  categories_in_order:
    TRACKING_OR_LINKAGE_MISSING: "gain team 0 / start clock NaN / no direction for (period, team) / no tracking frames in the game"
    FIRST_FGA_OBSERVED: "next row is a FGA by the gaining team in the same period, valid shooter/value/result, 0 <= time_into_possession <= 24 s (the primary sample)"
    TURNOVER_BEFORE_FGA: "next row is a Turnover by the gaining team"
    SHOOTING_FOUL_OR_FREE_THROWS_BEFORE_FGA: "next row is a Foul by the opponent with subType in {Shooting, Shooting Block, Flagrant Type 1, Flagrant Type 2, Clear Path} or a Free Throw row"
    NONSHOOTING_FOUL_OR_DEAD_BALL_BEFORE_FGA: "next row is any other Foul (Personal, Loose Ball, Offensive, Personal Take, Offensive Charge, Personal Block, Technical, Defense 3 Second, Double *, Inbound, Away From Play, Delay Technical, Taunting/Hanging Technical), Violation, Timeout, Substitution, Instant Replay, Jump Ball, Ejection"
    POSSESSION_END_OR_CONTROL_CHANGE_WITHOUT_FGA: "next row is a period-end row, a FGA/Rebound/Turnover by the OPPONENT, or there is no next row (game end)"
    OTHER_RESOLVED: "next row is a FGA by the gaining team but time_into_possession > 24 s or in a different period, or shot fields invalid (personId 0, shotValue not in {2,3})"
    UNRESOLVED: "anything not matched above"
  evaluation_instant_s: 6.0
  alive_at_6s: "the next PBP row (paired STEAL skipped) has clock <= c0 - 6.0 on the PBP axis (nothing has happened by 6.0 s) AND the game has tracking; N_BACK at 6.0 s = N_BACK at the frame nearest (c0 + 4.0 - 6.0) within +/-0.06 s else +/-0.20 s, else missing (counted)"
  report: ["taxonomy counts and % over the universe", "among alive-at-6s starts: P(enters FIRST_FGA sample | FIVE_BACK at 6 s = 0) and = 1, with game-clustered CI of the difference", "same split by start type, period (1-2 / 3-4+), margin band (trailing <= -6 / within 5 / leading >= 6)"]
  no_ipw: true
  no_estimand_change: true
  classification:
    SELECTION_MINOR: "entry probabilities differ little between FIVE_BACK states and the differences have no mechanism that would bias the FIVE_BACK-rim association"
    SELECTION_PRESENT_BUT_INTERPRETABLE: "entry differs by state but the mechanism is documented and the primary estimand (first FGA, conditional on shooting) remains interpretable"
    SELECTION_THREATENS_PRIMARY: "entry differs by state in a way that plausibly manufactures the primary association (e.g. rim attempts systematically censored in one state)"
  qualitative_only: true
pass_criteria:
  FIVE_BACK_FINAL_PASS_requires: ["regeneration check PASS and construct unchanged", "GOOD_COMMON_SUPPORT", "stratified FIVE_BACK coefficient <= -5 pp with 95 % CI excluding 0 (per the primary decision rule)", "FC2 FIVE_BACK coefficient negative with CI excluding 0 and FC2 fit >= FC1 (CV log-loss not worse)", "selection classified MINOR or PRESENT_BUT_INTERPRETABLE", "no previously hidden coding issue found while regenerating"]
  else: FIVE_BACK_FINAL_HOLD
  no_rescue: true
statistics: "OLS/LPM with game-clustered SE, two-sided 95 % CI; CV log-loss = 5-fold GroupKFold over games, logistic C=1e6, seed 20260920 (as in analyze_fiveback.py)"
